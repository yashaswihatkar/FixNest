<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FixNest Admin</title>

<style>

body{
font-family:"Segoe UI",sans-serif;
background:#eef7f0;
margin:0;
padding:20px;
}

h1{
text-align:center;
color:#1b5e20;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 8px 20px rgba(0,0,0,0.1);
text-align:center;
}

.section{
margin-top:30px;
}

table{
width:100%;
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

th, td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:center;
}

th{
background:#2e7d32;
color:white;
}

input{
padding:8px;
margin:5px;
border-radius:6px;
border:1px solid #ccc;
}

button{
padding:8px 12px;
background:#2e7d32;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

.skills label{
display:inline-block;
margin:5px;
}

</style>
</head>

<body>

<h1>🚀 FixNest Admin Dashboard</h1>

<!-- DASHBOARD -->

<div class="dashboard">



<div class="card">
<h2>Total Technicians</h2>
<p id="totalTech">0</p>
</div>

<div class="card">
<h2>Total Requests</h2>
<p id="totalRequests">0</p>
</div>

<div class="card">
<h2>Completed</h2>
<p id="completed">0</p>
</div>

</div>

<!-- ADD TECHNICIAN -->

<div class="section">
<h2>➕ Add Technician</h2>

<input type="text" id="techName" placeholder="Technician Name">

<div class="skills">
<label><input type="checkbox" value="Table Fan"> Fan</label>
<label><input type="checkbox" value="Electric Iron"> Iron</label>
<label><input type="checkbox" value="Mixer Grinder"> Mixer</label>
<label><input type="checkbox" value="Electric Kettle"> Kettle</label>
<label><input type="checkbox" value="Vacuum Cleaner"> Vacuum</label>
<label><input type="checkbox" value="LED Lamp"> LED</label>
<label><input type="checkbox" value="Blender"> Blender</label>
<label><input type="checkbox" value="Rice Cooker"> Cooker</label>
<label><input type="checkbox" value="Extension Borad"> Extension</label>
<label><input type="checkbox" value="Toaster"> Toaster</label>


</div>

<button onclick="addTech()">Add Technician</button>

</div>

<!-- TECHNICIANS -->

<div class="section">
<h2>👨‍🔧 Technicians</h2>

<table id="techTable">
<tr>
<th>Name</th>
<th>Skills</th>
<th>Status</th>
</tr>
</table>

</div>

<!-- REQUESTS -->

<div class="section">
<h2>📋 Requests</h2>

<table id="requestTable">
<tr>
<th>User</th>
<th>Email</th>
<th>Product</th>
<th>Date</th>
<th>Time</th>
<th>Status</th>
<th>Assign</th>
<th>Assigned Tech</th>
</tr>
</table>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCgKI-RxIdn2_LYhhBvsIx7etRYrXG4rig",
authDomain: "ai-customer-support-assi-5af0d.firebaseapp.com",
projectId: "ai-customer-support-assi-5af0d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* LOAD DASHBOARD */

async function loadDashboard(){

// CLEAR TABLES
techTable.innerHTML = `<tr><th>Name</th><th>Skills</th><th>Status</th></tr>`;
requestTable.innerHTML = `
<tr>
<th>User</th><th>Email</th><th>Product</th>
<th>Date</th><th>Time</th><th>Status</th>
<th>Assign</th><th>Assigned Tech</th>
</tr>`;



// REQUESTS
let reqSnap = await getDocs(collection(db,"technicianRequests"));

let totalReq = 0;
let completedCount = 0;

reqSnap.forEach(docData=>{

let d = docData.data();
totalReq++;

if(d.status === "Completed") completedCount++;

requestTable.innerHTML += `
<tr>
<td>${d.name}</td>
<td>${d.email}</td>
<td>${d.product}</td>
<td>${d.preferredDate || "-"}</td>
<td>${d.preferredTime || "-"}</td>

<td>
<select onchange="updateStatus('${docData.id}', this.value)">
<option ${d.status=="Pending"?"selected":""}>Pending</option>
<option ${d.status=="Assigned"?"selected":""}>Assigned</option>
<option ${d.status=="Completed"?"selected":""}>Completed</option>
</select>
</td>

<td>
<select class="assignDropdown" data-id="${docData.id}" data-product="${d.product}">
<option value="">Select</option>
</select>
</td>

<td>${d.assignedTech || "-"}</td>
</tr>
`;

});

totalRequests.innerText = totalReq;
completed.innerText = completedCount;

// TECHNICIANS
let techSnap = await getDocs(collection(db,"technicians"));
totalTech.innerText = techSnap.size;

let techList = [];

techSnap.forEach(docData=>{
let d = docData.data();

techTable.innerHTML += `
<tr>
<td>${d.name}</td>
<td>${Array.isArray(d.skills) ? d.skills.join(", ") : d.skill}</td>
<td>${d.available ? "Available" : "Busy"}</td>
</tr>
`;

techList.push({id:docData.id,...d});

});

// FILL DROPDOWN
document.querySelectorAll(".assignDropdown").forEach(select=>{

let product = select.getAttribute("data-product");
let reqId = select.getAttribute("data-id");

techList.forEach(t=>{

if(t.available && t.skills.includes(product)){
let option = document.createElement("option");
option.value = t.id;
option.text = t.name;
select.appendChild(option);
}

});

select.onchange = function(){
assignTech(reqId,this.value);
};

});

}

/* ADD TECHNICIAN */

window.addTech = async ()=>{

let name = techName.value;
let skills = [...document.querySelectorAll(".skills input:checked")]
.map(e=>e.value);

if(!name || skills.length===0){
alert("Enter name + select skills");
return;
}

await addDoc(collection(db,"technicians"),{
name,
skills,
available:true
});

// RESET
techName.value="";
document.querySelectorAll(".skills input").forEach(cb=>cb.checked=false);

alert("Technician Added!");

loadDashboard();

};

/* UPDATE STATUS */

window.updateStatus = async (id,status)=>{
await updateDoc(doc(db,"technicianRequests",id),{status});
};

/* ASSIGN TECH */

window.assignTech = async (reqId, techId)=>{

if(!techId) return;

// GET TECH
let techSnap = await getDocs(collection(db,"technicians"));
let selected;

techSnap.forEach(d=>{
if(d.id===techId) selected=d.data();
});

// UPDATE REQUEST
await updateDoc(doc(db,"technicianRequests",reqId),{
assignedTech:selected.name,
status:"Assigned"
});

// MAKE TECH BUSY
await updateDoc(doc(db,"technicians",techId),{
available:false
});

alert("Assigned: "+selected.name);

loadDashboard();

};

/* INIT */

loadDashboard();

</script>

</body>
</html>
